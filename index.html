<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            grid-template-rows: repeat(9, 40px);
            gap: 1px;
            background-color: #888;
            padding: 5px;
            border-radius: 4px;
        }

        .cell {
            width: 40px;
            height: 40px;
            background-color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            border: 1px solid #888;
        }

        .cell:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>
    <div class="grid" id="game-grid">
        <!-- Cells will be generated by JavaScript -->
    </div>

    <script>
        // Create the 9x9 grid
        const grid = document.getElementById('game-grid');

        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.setAttribute('data-index', i);
            grid.appendChild(cell);
        }

        // Mine placement and adjacency counting
        function initializeGame() {
            // Create a 9x9 board representation (array of 81 elements)
            const board = new Array(81).fill(0);

            // Place 10 mines randomly
            let minesPlaced = 0;
            while (minesPlaced < 10) {
                const randomIndex = Math.floor(Math.random() * 81);
                if (board[randomIndex] !== 'M') {
                    board[randomIndex] = 'M';
                    minesPlaced++;
                }
            }

            // Calculate adjacency counts for non-mine cells
            for (let i = 0; i < 81; i++) {
                if (board[i] !== 'M') {
                    let count = 0;

                    // Check all 8 adjacent cells (including diagonals)
                    const row = Math.floor(i / 9);
                    const col = i % 9;

                    for (let r = Math.max(0, row - 1); r <= Math.min(8, row + 1); r++) {
                        for (let c = Math.max(0, col - 1); c <= Math.min(8, col + 1); c++) {
                            // Skip the cell itself
                            if (r === row && c === col) continue;

                            const adjacentIndex = r * 9 + c;
                            if (board[adjacentIndex] === 'M') {
                                count++;
                            }
                        }
                    }

                    board[i] = count;
                }
            }

            // Log the full board state to console
            console.log("Minesweeper Board State:");
            let boardString = "";
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const index = i * 9 + j;
                    if (board[index] === 'M') {
                        boardString += "M ";
                    } else {
                        boardString += board[index] + " ";
                    }
                }
                boardString += "\n";
            }
            console.log(boardString);

            return board;
        }

        // Initialize the game
        const gameBoard = initializeGame();

        // Add click event listeners to cells
        const cells = document.querySelectorAll('.cell');

        // Track revealed cells to prevent re-revealing
        const revealedCells = new Set();

        // Game over flag
        let gameOver = false;

        function revealCell(index) {
            // Don't reveal if already revealed or flagged
            if (revealedCells.has(index)) return;

            revealedCells.add(index);

            const cell = cells[index];
            const value = gameBoard[index];

            // Update cell display
            if (value === 'M') {
                // Mine - show mine symbol
                cell.textContent = '💣';
                cell.style.backgroundColor = '#f00';
                // Game over - stop further interaction for now
                gameOver = true;
                return;
            } else {
                // Show the adjacency count or empty if 0
                cell.textContent = value > 0 ? value : '';
                cell.style.backgroundColor = '#fff';

                // If this is a 0, reveal all connected cells (flood-fill)
                if (value === 0) {
                    revealAdjacentCells(index);
                }
            }
        }

        function revealAdjacentCells(index) {
            const row = Math.floor(index / 9);
            const col = index % 9;

            // Check all 8 adjacent cells
            for (let r = Math.max(0, row - 1); r <= Math.min(8, row + 1); r++) {
                for (let c = Math.max(0, col - 1); c <= Math.min(8, col + 1); c++) {
                    // Skip the cell itself
                    if (r === row && c === col) continue;

                    const adjacentIndex = r * 9 + c;

                    // Reveal this adjacent cell if not already revealed
                    revealCell(adjacentIndex);
                }
            }
        }

        // Add click event listeners to all cells
        cells.forEach((cell, index) => {
            cell.addEventListener('click', () => {
                if (gameOver) return;
                revealCell(index);
            });
        });
    </script>
</body>

</html>
