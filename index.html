<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <style>
      :root {
        --cell-size: 32px;
        --grid-line: #c9c9c9;
        --cell-bg: #f7f7f7;
        --cell-hover: #e2e2e2;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #e6e6e6;
        font-family: system-ui, -apple-system, sans-serif;
      }

      /* 9x9 grid of fixed-size cells. We get uniform 1px lines everywhere
         (including the outer edge) by giving the container the top+left
         borders and each cell its right+bottom borders. */
      .grid {
        display: grid;
        grid-template-columns: repeat(9, var(--cell-size));
        grid-template-rows: repeat(9, var(--cell-size));
        border-top: 1px solid var(--grid-line);
        border-left: 1px solid var(--grid-line);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }

      .cell {
        width: var(--cell-size);
        height: var(--cell-size);
        box-sizing: border-box;
        border-right: 1px solid var(--grid-line);
        border-bottom: 1px solid var(--grid-line);
        background: var(--cell-bg);
        cursor: pointer;
      }

      .cell:hover {
        background: var(--cell-hover);
      }

      .cell.revealed {
        background: #dcdcdc;
        cursor: default;
      }

      /* A revealed cell's adjacency number. Mine cells show no number. */
      .cell.revealed[data-count] {
        font-size: calc(var(--cell-size) * 0.5);
        font-weight: bold;
        text-align: center;
        line-height: var(--cell-size);
      }

      /* Revealed mine. Game-over behavior is a separate task -- this is
         just a visible "this cell was a mine" state. */
      .cell.revealed.mine {
        background: #b3b3b3;
      }

      /* Flagged cell: the flag glyph itself is set by JS (textContent) on
         right-click; this only centers it, matching the revealed-number
         styling. */
      .cell.flagged {
        font-size: calc(var(--cell-size) * 0.5);
        text-align: center;
        line-height: var(--cell-size);
      }

      /* Mine counter above the message: remaining mines (total minus
         flagged). min-width keeps the box from changing size as the digits
         change, so nothing below it shifts. */
      .counter {
        min-width: 4ch;
        margin-bottom: 8px;
        padding: 2px 10px;
        background: #333;
        color: #ff5555;
        border-radius: 4px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 2px;
        text-align: center;
      }

      /* Win/loss banner above the grid: empty until the game ends, then
         .win / .loss (set by JS) colors it. min-height keeps the grid from
         shifting down when the text appears. */
      .message {
        min-height: 24px;
        margin-bottom: 8px;
        font-size: 20px;
        font-weight: bold;
      }
      .message.win {
        color: #1a7f37;
      }
      .message.loss {
        color: #b3261e;
      }

      /* Restart button below the grid: plain system styling, no framework. */
      .restart {
        margin-top: 12px;
        padding: 6px 16px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        background: var(--cell-bg);
        border: 1px solid var(--grid-line);
        border-radius: 4px;
        cursor: pointer;
      }
      .restart:hover {
        background: var(--cell-hover);
      }
    </style>
  </head>
  <body>
    <div class="counter" id="mine-counter">10</div>
    <div class="message" id="message"></div>
    <div class="grid" id="grid"></div>
    <button class="restart" id="restart-button" type="button">Restart</button>

    <script>
      // Build the 9x9 grid of empty cells. No game logic yet -- this only
      // creates the DOM nodes so the grid is present on page load.
      function buildGrid() {
        const grid = document.querySelector("#grid");
        const rows = 9;
        const cols = 9;

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const cellIndex = row * cols + col;
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.dataset.index = cellIndex;
            grid.appendChild(cell);
          }
        }
      }

      buildGrid();

      // ---- Mine placement and adjacency counting ----
      //
      // Pure functions: no DOM, no UI. The grid cells on the page are still
      // blank -- displaying these numbers is a later step.

      // Pick `mineCount` distinct, uniformly random cells out of a rows x
      // cols grid. Returns a flat array of rows*cols booleans (true = mine).
      // `rng` is optional (defaults to Math.random) so tests can pass a
      // deterministic generator and re-check the same board.
      function placeMines(rows, cols, mineCount, rng) {
        const random = rng || Math.random;
        const totalCells = rows * cols;

        // Selection without replacement: for each mine slot in turn, swap a
        // random cell from the remaining pool into place. Every cell has an
        // equal chance of landing in a mine slot, and no cell is picked twice.
        const indices = [];
        for (let i = 0; i < totalCells; i++) indices.push(i);

        for (let i = 0; i < mineCount; i++) {
          const j = i + Math.floor(random() * (totalCells - i));
          const temp = indices[i];
          indices[i] = indices[j];
          indices[j] = temp;
        }

        const board = new Array(totalCells).fill(false);
        for (let i = 0; i < mineCount; i++) board[indices[i]] = true;
        return board;
      }

      // Count, for each non-mine cell, how many of its up to 8 neighbors
      // (including diagonals) are mines. Returns a flat array of the same
      // length; mine cells are left at 0.
      function countAdjacentMines(board, rows, cols) {
        const counts = new Array(board.length).fill(0);

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const cellIndex = row * cols + col;
            if (board[cellIndex]) continue; // mines don't get a count

            let adjacentMines = 0;
            for (let deltaRow = -1; deltaRow <= 1; deltaRow++) {
              for (let deltaCol = -1; deltaCol <= 1; deltaCol++) {
                if (deltaRow === 0 && deltaCol === 0) continue; // skip self
                const neighborRow = row + deltaRow;
                const neighborCol = col + deltaCol;
                // Edge/corner cells have fewer neighbors; out-of-grid
                // positions are skipped, which keeps their counts correct.
                if (neighborRow < 0 || neighborRow >= rows) continue;
                if (neighborCol < 0 || neighborCol >= cols) continue;
                if (board[neighborRow * cols + neighborCol]) adjacentMines++;
              }
            }
            counts[cellIndex] = adjacentMines;
          }
        }
        return counts;
      }

      // This page's board for the game. mineBoard and adjacencyCounts are
      // `let` (not `const`) so resetGame() can hand out fresh arrays.
      const rows = 9;
      const cols = 9;
      const mineCount = 10;
      let mineBoard = placeMines(rows, cols, mineCount);
      let adjacencyCounts = countAdjacentMines(mineBoard, rows, cols);
      // Which cells the player has opened. Tracked here, not by reading the
      // DOM, so the game state stays in one place.
      const revealed = new Array(rows * cols).fill(false);
      // Which cells carry a flag (only ever unrevealed cells). Tracked the
      // same way as `revealed`.
      const flagged = new Array(rows * cols).fill(false);
      // Game-over flag: once a mine is revealed, every interaction check
      // consults this before touching game state.
      let gameOver = false;
      // Win flag: once every non-mine cell is revealed, the same guard in
      // the handlers freezes the board. The handler checks the mine (loss)
      // first, so the board ends in exactly one terminal state, never both.
      let gameWon = false;

      // ---- Reveal + flood-fill (game-over guard handled in the handler) ----
      //
      // Pure functions of the board data: no DOM, so the flood-fill behavior
      // can be tested with a fixed board.

      // Flood-fill reveal: given a starting cell, return the flat array of
      // cell indices that get revealed. Standard Minesweeper rule: opening a
      // cell with 0 adjacent mines also opens every 0-cell reachable through
      // the 8-neighborhood, and the numbered cells that border that region.
      // A cell that has any adjacent mine (or is a mine) is revealed but
      // never expanded into -- numbered cells are the region's boundary, and
      // a mine just reveals itself here. A flagged cell (from the `flagged`
      // array) is skipped entirely: not revealed and not expanded into, so
      // the fill stops at it and can never cross through it. Stopping the
      // game on a mine reveal (the gameOver guard) and refusing direct
      // clicks on flagged cells live in the handlers below.
      //
      // Uses an explicit stack instead of recursion: a large open area would
      // otherwise mean a 9x9-sized chain of calls per click.
      function floodFill(startIndex, adjacencyCounts, mineBoard, rows, cols, flagged) {
        const revealedSet = new Set();
        const stack = [startIndex];

        while (stack.length > 0) {
          const cellIndex = stack.pop();
          if (revealedSet.has(cellIndex)) continue;
          // Flagged cells act like mines in the fill: the cascade stops at
          // them and cannot reach any cell only reachable through one.
          if (flagged[cellIndex]) continue;
          revealedSet.add(cellIndex);

          const row = Math.floor(cellIndex / cols);
          const col = cellIndex % cols;
          const adjacentMines = adjacencyCounts[cellIndex];
          const isMine = mineBoard[cellIndex];

          // A mine, or a cell with adjacent mines, reveals itself but does
          // not propagate: these are exactly what stop the fill.
          if (isMine || adjacentMines !== 0) continue;

          // 0-cell: queue all in-bounds neighbors (out-of-grid positions are
          // skipped, so the fill never crosses an edge) for processing on
          // the next iteration.
          for (let deltaRow = -1; deltaRow <= 1; deltaRow++) {
            for (let deltaCol = -1; deltaCol <= 1; deltaCol++) {
              if (deltaRow === 0 && deltaCol === 0) continue; // skip self
              const neighborRow = row + deltaRow;
              const neighborCol = col + deltaCol;
              if (neighborRow < 0 || neighborRow >= rows) continue;
              if (neighborCol < 0 || neighborCol >= cols) continue;
              stack.push(neighborRow * cols + neighborCol);
            }
          }
        }
        return Array.from(revealedSet);
      }

      // Decide which cells open when one cell is clicked: itself, or the
      // whole connected 0-region if the click landed on a 0-cell.
      function revealCell(cellIndex, adjacencyCounts, mineBoard, rows, cols, flagged) {
        if (adjacencyCounts[cellIndex] === 0 && !mineBoard[cellIndex]) {
          return floodFill(cellIndex, adjacencyCounts, mineBoard, rows, cols, flagged);
        }
        return [cellIndex];
      }

      // Win check: the game is won when every non-mine cell is revealed.
      // Flags are irrelevant to winning -- flags can only sit on unrevealed
      // cells, so a flagged safe cell simply counts as not-yet-revealed,
      // and a flagged mine is just a mine.
      function checkWin(mineBoard, revealed, rows, cols) {
        for (let cellIndex = 0; cellIndex < rows * cols; cellIndex++) {
          if (!mineBoard[cellIndex] && !revealed[cellIndex]) return false;
        }
        return true;
      }

      // Win/loss banner: one shared element, text + class set by JS. It is
      // only ever set once, because the first terminal state (win or loss)
      // freezes the board.
      const messageEl = document.querySelector("#message");
      function showMessage(text, cssClass) {
        messageEl.textContent = text;
        messageEl.classList.add(cssClass);
      }

      // Mine counter: remaining mines = total mines minus flags placed.
      // The flag count comes from the `flagged` array (the source of truth),
      // not by scanning the DOM. Only ever changes when a flag is toggled in
      // the contextmenu handler below, so after a win or loss it freezes in
      // place along with the rest of the board.
      const mineCounterEl = document.querySelector("#mine-counter");
      function updateMineCounter() {
        let flaggedCount = 0;
        for (let i = 0; i < flagged.length; i++) {
          if (flagged[i]) flaggedCount++;
        }
        mineCounterEl.textContent = String(mineCount - flaggedCount);
      }
      updateMineCounter();

      // ---- Reveal: DOM ----

      // Show one cell in its revealed state: number, blank, or mine.
      function paintCell(cellIndex) {
        const cell = document.querySelector(
          ".cell[data-index='" + cellIndex + "']"
        );
        if (cell.dataset.revealed === "true") return;
        cell.dataset.revealed = "true";
        cell.classList.add("revealed");
        if (mineBoard[cellIndex]) {
          cell.classList.add("mine");
        } else if (adjacencyCounts[cellIndex] > 0) {
          cell.textContent = String(adjacencyCounts[cellIndex]);
          cell.dataset.count = String(adjacencyCounts[cellIndex]);
        }
      }

      // One delegated listener on the grid: look up the clicked cell,
      // compute the cells to open, paint them, and record them as revealed.
      document.querySelector("#grid").addEventListener("click", (event) => {
        const cell = event.target.closest(".cell");
        if (!cell) return;
        const cellIndex = Number(cell.dataset.index);

        // Terminal-state guards: once the game is over or won, ignore all
        // further interaction so state and the board can't change anymore.
        if (gameOver) return;
        if (gameWon) return;

        // A flagged cell can't be opened with a left-click; right-click it
        // again to remove the flag first. (The fill also never cascades
        // through flagged cells.)
        if (flagged[cellIndex]) return;

        const indices = revealCell(
          cellIndex,
          adjacencyCounts,
          mineBoard,
          rows,
          cols,
          flagged
        );
        for (const index of indices) {
          revealed[index] = true;
          paintCell(index);
        }

        // Reveal this cell is a mine = game over, loss message. This is the
        // only way a mine can be revealed: flood-fill starts from 0-cells,
        // and 0-cells have no adjacent mines, so a fill can never surface
        // one. Checked before the win check: a final unclicked mine is a
        // loss even if every safe cell was already open.
        if (mineBoard[cellIndex]) {
          gameOver = true;
          showMessage("You lose!", "loss");
          return;
        }

        // Every non-mine cell revealed = win, win message.
        if (checkWin(mineBoard, revealed, rows, cols)) {
          gameWon = true;
          showMessage("You win!", "win");
        }
      });

      // Right-click: toggle a flag on an unrevealed cell (flag it, or remove
      // it if already flagged). Delegated on the grid, like the click
      // handler.
      document
        .querySelector("#grid")
        .addEventListener("contextmenu", (event) => {
          // Suppress the browser's context menu over the grid, even when
          // the right-click itself does nothing (revealed cell, game over).
          event.preventDefault();

          const cell = event.target.closest(".cell");
          if (!cell) return;
          const cellIndex = Number(cell.dataset.index);

          // Same terminal-state guards as the click handler: once the game
          // is over or won, no further interaction of any kind.
          if (gameOver) return;
          if (gameWon) return;

          // Flags only go on unrevealed cells.
          if (revealed[cellIndex]) return;

          // Toggle: right-clicking a flagged cell removes the flag.
          flagged[cellIndex] = !flagged[cellIndex];
          cell.classList.toggle("flagged", flagged[cellIndex]);
          cell.textContent = flagged[cellIndex] ? "🚩" : "";
          updateMineCounter();
        });

      // ---- Restart ----
      //
      // Put the game back to its before-first-click state. Everything the
      // game tracks is reset here in one place:
      //   state:    mineBoard, adjacencyCounts, revealed, flagged,
      //             gameOver, gameWon
      //   visuals:  every cell's classes/text/dataset, the win/loss
      //             message, and the mine counter
      // A fresh random mine layout each restart is the classic behavior.
      function resetGame() {
        mineBoard = placeMines(rows, cols, mineCount);
        adjacencyCounts = countAdjacentMines(mineBoard, rows, cols);
        revealed.fill(false);
        flagged.fill(false);
        gameOver = false;
        gameWon = false;

        for (const cell of document.querySelectorAll("#grid .cell")) {
          cell.classList.remove("revealed", "mine", "flagged");
          cell.dataset.revealed = "false";
          cell.textContent = "";
        }
        messageEl.textContent = "";
        messageEl.classList.remove("win", "loss");
        updateMineCounter();
      }

      document
        .querySelector("#restart-button")
        .addEventListener("click", resetGame);
    </script>
  </body>
</html>
